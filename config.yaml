# SkyScout settings and hyperparameters. Change values here, not in skyscout.py.

seed: 42

dataset:
  base_url: https://github.com/ultralytics/assets/releases/download/v0.0.0
  splits:
    train: VisDrone2019-DET-train
    val: VisDrone2019-DET-val
    test: VisDrone2019-DET-test-dev
  names: [pedestrian, people, bicycle, car, van, truck, tricycle, awning-tricycle, bus, motor]
  drop_categories: [0, 11]   # 0 = ignored regions, 11 = others

# Each machine is detected automatically (WSL counts as local). Set SKYSCOUT_PROFILE=colab|server|local to force one.
# data_dir (optional) = where the dataset is extracted, otherwise downloads/VisDrone
# epochs (optional) = per-machine epochs by experiment name or family, otherwise the values below
# cooldown (optional) = breaks between epochs, remove it to train without breaks
# Recommended: if you get an out-of-memory error, lower the batch for that input size.
profiles:
  colab:
    # Recommended: keep the extracted dataset on the Colab local disk, reading thousands of images from Drive is slow
    data_dir: /content/data
    yolo_batch: {640: 16, 1024: 6}
    dfine_batch: {640: 8, 1024: 2}
    workers: 2
  server:
    yolo_batch: {640: 16, 1024: 8}
    dfine_batch: {640: 8, 1024: 4}
    workers: 8
  local:
    yolo_batch: {640: 8, 1024: 2}
    dfine_batch: {640: 4, 1024: 1}   # Recommended: lower it if training runs out of GPU memory
    workers: 4
    # Recommended: shorter schedules so every run fits on one consumer GPU in about a day
    epochs: {yolo: 50, dfine: 6, dfine_best_long_640: 10}
    # Breaks at epoch ends so the machine can cool down: every N minutes of training, or early when the GPU is too hot
    cooldown: {every_minutes: 60, pause_minutes: 10, max_gpu_temp: 85, resume_gpu_temp: 60}
    device_label: local GPU   # saved instead of the exact GPU model, so public results do not name the machine

# Ultralytics training arguments (passed straight to model.train)
yolo:
  epochs: 100
  patience: 30
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  cos_lr: false
  close_mosaic: 10
  amp: true
  cache: false
  plots: true

# D-FINE (KerasHub, TensorFlow backend)
dfine:
  preset: dfine_small_obj2coco
  epochs: 30
  lr: 0.0001            # Recommended: D-FINE uses 2e-4 at batch 32, halved here for the smaller batches
  min_lr_ratio: 0.05
  warmup_epochs: 1
  weight_decay: 0.0001
  clipnorm: 0.1
  ema: false            # Recommended: Keras EMA adds about a third to every step, turn on for long schedules
  ema_momentum: 0.999   # Recommended: keep at 0.999, Keras EMA has no warmup so 0.9999 keeps too much of the untrained head
  llrd_decay: 0.8       # lr multiplier per backbone group, earliest layers get the smallest lr
  llrd_groups: 5
  max_boxes: 300        # D-FINE matches at most one object per query
  min_box_px: 1         # drop boxes smaller than this after resizing
  hflip: 0.5
  val_images: 300       # images used for val loss each epoch
  jit_compile: false

# Order matters: the three D-FINE setups must finish before any 'best' run.
# setup: frozen = train only encoder and decoder, full = train everything, llrd = full with layer-wise lr decay
# setup: best = whichever of dfine_setup_compare has the highest val mAP50-95
# run_on limits where a run starts, the others print a recommendation instead
experiments:
  yolo11s_640:      {family: yolo, weights: yolo11s.pt, imgsz: 640}
  yolo26s_640:      {family: yolo, weights: yolo26s.pt, imgsz: 640}
  dfine_frozen_640: {family: dfine, setup: frozen, imgsz: 640}
  dfine_full_640:   {family: dfine, setup: full, imgsz: 640}
  dfine_llrd_640:   {family: dfine, setup: llrd, imgsz: 640}
  dfine_best_long_640: {family: dfine, setup: best, init_from: best, imgsz: 640, epochs: 40, overrides: {lr: 0.00005}}
  dfine_best_25:    {family: dfine, setup: best, imgsz: 640, fraction: 0.25}
  dfine_best_50:    {family: dfine, setup: best, imgsz: 640, fraction: 0.5}
  yolo11s_1024:     {family: yolo, weights: yolo11s.pt, imgsz: 1024, run_on: [server]}
  yolo26s_1024:     {family: yolo, weights: yolo26s.pt, imgsz: 1024, run_on: [server]}
  dfine_best_1024:  {family: dfine, setup: best, imgsz: 1024, run_on: [server]}

dfine_setup_compare: [dfine_frozen_640, dfine_full_640, dfine_llrd_640]

evaluation:
  splits: [val, test]
  report_split: test
  select_split: val
  conf: 0.001
  max_det: 300
  pr_iou: 0.5
  cm_conf: 0.25
  cm_iou: 0.45
  warmup: 10            # first images skipped in latency numbers
  latency_images: 200   # images timed by `python skyscout.py latency`
  save_every: 200       # evaluation progress is saved every N images
  sample_images: 3
  limit: null           # set a number for a quick test run

# SAHI tiled inference: overlapping tiles, detect on each, merge with NMS
sahi:
  experiments: [yolo11s_640, yolo26s_640, dfine_best_long_640]
  tile: 640
  overlap: 0.25
  include_full_image: true
  merge_iou: 0.6
  batch: 4

# 'best' = the best D-FINE setup at 30 epochs (picked on val mAP50-95)
report:
  main_models: {yolo11s_640: YOLO11s (baseline), yolo26s_640: YOLO26s (newest YOLO), dfine_best_long_640: D-FINE (fine-tuned)}
  data_efficiency: {25: dfine_best_25, 50: dfine_best_50, 100: best}
  compare_images: 6           # python skyscout.py compare: busy test images, one per scene
  compare_min_objects: 40
  input_size_pairs:
    - [yolo11s_640, yolo11s_1024]
    - [yolo26s_640, yolo26s_1024]
    - [best, dfine_best_1024]

demo:
  conf: 0.3             # fallback only, each model starts at its saved best-F1 confidence
  server_port: 7860
  video_max_frames: 300   # Recommended: keep demo videos short, longer clips are cut here
  video_stride: 1         # 2 = run on every second frame
  video_max_width: 1280   # output video width, detection still runs on the full frame
  clip_frames: 60         # sample clip made from one VisDrone test-dev sequence
  clip_fps: 2
  samples_clip_width: 960   # smaller copy of the clip saved in samples/ (kept in git)
  pack_models: [yolo11s_640, yolo26s_640, dfine_best_long_640]   # python skyscout.py pack
  # Trained demo models on the GitHub release, used by fetch_models() when models/ is empty
  models_url: https://github.com/fnmoral/skyscout-small-object-detection-yolo-vs-dfine-visdrone/releases/download/models-v1/skyscout_models.zip
  models_sha256: dfb347ce06074d6f55a812b0dd9230ef1dd28900cdefb9390f84c5de268021a2   # zip is only unpacked if it matches
  sample_video_urls: []   # optional extra .mp4 links, saved to downloads/samples
